name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.12"
        required: true

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

jobs:
  build-native:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs_on: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: zapterm
          - name: windows
            runs_on: windows-latest
            goos: windows
            goarch: amd64
            binary: ZapTerm.exe

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p build
          go build -trimpath -ldflags="-s -w" -o "build/$BINARY" .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-asset
          path: build/${{ matrix.binary }}

  build-raspberrypi:
    name: Build raspberrypi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabi

      - name: Build binary
        env:
          CGO_ENABLED: "1"
          CC: arm-linux-gnueabi-gcc
          GOOS: linux
          GOARCH: arm
          GOARM: "5"
        run: |
          mkdir -p build
          go build -trimpath -ldflags="-s -w" -o build/zapterm .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: raspberrypi-asset
          path: build/zapterm

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-native
      - build-raspberrypi

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      # Monta os mesmos pacotes do "make dist": binario + lancador +
      # instalador de atalho + atualizador + LEIA-ME + icone.
      - name: Package assets
        run: |
          mkdir -p release-assets pkg

          package_unix() { # package_unix <flavor> <binario-artifact>
            local flavor="$1" bin="$2" dir="pkg/ZapTerm-$1"
            mkdir -p "$dir"
            cp "$bin" "$dir/zapterm"
            cp packaging/linux/Abrir-ZapTerm.sh \
               packaging/linux/Instalar-no-menu.sh \
               packaging/linux/Atualizar-ZapTerm.sh \
               packaging/linux/LEIA-ME.txt \
               "$dir/"
            cp assets/zapterm.png "$dir/"
            chmod +x "$dir"/*.sh "$dir/zapterm"
            (cd pkg && zip -qr "../release-assets/ZapTerm-${RELEASE_VERSION}-${flavor}.zip" "ZapTerm-$flavor")
          }

          package_unix linux artifacts/linux-asset/zapterm
          package_unix raspberrypi artifacts/raspberrypi-asset/zapterm

          mkdir -p pkg/ZapTerm-windows
          cp artifacts/windows-asset/ZapTerm.exe pkg/ZapTerm-windows/
          cp packaging/windows/Abrir-ZapTerm.bat \
             packaging/windows/Instalar-no-menu-iniciar.bat \
             packaging/windows/Atualizar-ZapTerm.bat \
             packaging/windows/LEIA-ME.txt \
             pkg/ZapTerm-windows/
          cp assets/zapterm.ico pkg/ZapTerm-windows/
          (cd pkg && zip -qr "../release-assets/ZapTerm-${RELEASE_VERSION}-windows.zip" ZapTerm-windows)

          ls -lah release-assets

      - name: Generate release notes
        shell: bash
        run: |
          current_tag="${RELEASE_VERSION}"
          previous_tag="$(git tag --sort=-v:refname | grep -vx "$current_tag" | head -n1)"
          if [ -n "$previous_tag" ]; then
            git log "$previous_tag..HEAD" --no-decorate --pretty=format:'- %s' --abbrev-commit > changes.txt
          else
            git log --no-decorate --pretty=format:'- %s' --abbrev-commit > changes.txt
          fi
          if [ ! -s changes.txt ]; then
            echo "- Release $current_tag" > changes.txt
          fi

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: changes.txt
          files: release-assets/*.zip
          draft: false
          prerelease: false
